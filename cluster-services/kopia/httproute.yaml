apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kopia-route
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Kopia"
    gethomepage.dev/group: "Developer & Infrastructure"
    gethomepage.dev/icon: "kopia.png"
    gethomepage.dev/description: "Encrypted cluster & ZFS backups"
  namespace: kopia   
spec:
  parentRefs:
    - group: gateway.networking.k8s.io	
      kind: Gateway
      name: crobceratops-gateway
      namespace: gateways
    - group: gateway.networking.k8s.io	
      kind: Gateway
      name: crobasaurusrex-gateway
      namespace: gateways
  hostnames:
    - kopia.crobceratops.ryanbeales.com
    - kopia.crobasaurusrex.ryanbeales.com
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - group: ''	
          kind: Service
          name: kopia
          port: 51515
          weight: 1