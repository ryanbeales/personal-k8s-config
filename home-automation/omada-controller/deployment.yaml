apiVersion: apps/v1
kind: Deployment
metadata:
  name: omada-controller
  namespace: omada-controller
  labels:
    app: omada-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omada-controller
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: omada-controller
    spec:
      initContainers:
        # Prepare Omada data directories, activate staged Kopia DB restores atomically,
        # and cap oversized mongod.log files after unclean shutdowns.
        - name: init-omada-data
          # renovate: datasource=docker depname=ubuntu versioning=ubuntu
          image: ubuntu:24.04
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /omada-data/autobackup
              rmdir /omada-data/configdb 2>/dev/null || true
              chown 508:508 /omada-data/autobackup
              if [ -d /omada-data/db.kopia-20260930 ]; then
                echo "Activating staged Kopia backup /omada-data/db.kopia-20260930..."
                chmod 0755 /omada-data/db.kopia-20260930
                chown -R 508:508 /omada-data/db.kopia-20260930
                if [ ! -d /omada-data/db.corrupt.bak ] && [ -d /omada-data/db ]; then
                  mv /omada-data/db /omada-data/db.corrupt.bak
                else
                  rm -rf /omada-data/db
                fi
                mv /omada-data/db.kopia-20260930 /omada-data/db
                rm -f /omada-data/mongo.pid
                if [ -f /omada-logs/mongod.log ]; then
                  tail -c 1048576 /omada-logs/mongod.log > /omada-logs/mongod.log.corrupt.bak || true
                  : > /omada-logs/mongod.log
                  chown 508:508 /omada-logs/mongod.log /omada-logs/mongod.log.corrupt.bak || true
                fi
                echo "Kopia backup activated successfully."
              fi
              if [ -f /omada-logs/mongod.log ] && [ "$(stat -c %s /omada-logs/mongod.log)" -gt 104857600 ]; then
                tail -c 1048576 /omada-logs/mongod.log > /omada-logs/mongod.log.prev || true
                : > /omada-logs/mongod.log
                chown 508:508 /omada-logs/mongod.log /omada-logs/mongod.log.prev || true
              fi
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: omada-data
              mountPath: /omada-data
              subPath: data
            - name: omada-data
              mountPath: /omada-logs
              subPath: logs
      containers:
        - name: omada-controller
          image: mbentley/omada-controller:5.15
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "America/Vancouver"
            - name: SHOW_INFO
              value: "true"
            - name: SHOW_SERVER_LOGS
              value: "true"
            - name: MANAGE_HTTP_PORT
              value: "8088"
            - name: MANAGE_HTTPS_PORT
              value: "8043"
            - name: PORTAL_HTTP_PORT
              value: "8088"
            - name: PORTAL_HTTPS_PORT
              value: "8843"
          ports:
            - name: manage-http
              containerPort: 8088
              protocol: TCP
            - name: manage-https
              containerPort: 8043
              protocol: TCP
            - name: portal-https
              containerPort: 8843
              protocol: TCP
            - name: discovery-udp
              containerPort: 29810
              protocol: UDP
            - name: mgmt-v1-tcp
              containerPort: 29811
              protocol: TCP
            - name: adopt-v1-tcp
              containerPort: 29812
              protocol: TCP
            - name: upgrade-v1-tcp
              containerPort: 29813
              protocol: TCP
            - name: mgmt-v2-tcp
              containerPort: 29814
              protocol: TCP
            - name: transfer-v2-tcp
              containerPort: 29815
              protocol: TCP
            - name: rtty-tcp
              containerPort: 29816
              protocol: TCP
            - name: mgmt-v3-tcp
              containerPort: 29817
              protocol: TCP
            - name: app-discovery
              containerPort: 27001
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: manage-https
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: omada-data
              mountPath: /opt/tplink/EAPController/data
              subPath: data
            - name: omada-data
              mountPath: /opt/tplink/EAPController/logs
              subPath: logs
      volumes:
        - name: omada-data
          persistentVolumeClaim:
            claimName: omada-nfs-pvc
