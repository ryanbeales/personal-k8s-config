apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zwavejs-route
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Z-Wave JS UI"
    gethomepage.dev/group: "Home Automation"
    gethomepage.dev/icon: "zwave-js-ui.png"
    gethomepage.dev/description: "Z-Wave network & device control panel"
  namespace: zwavejs
spec:
  parentRefs:
    - group: gateway.networking.k8s.io	
      kind: Gateway
      name: crobceratops-gateway
      namespace: gateways
    - group: gateway.networking.k8s.io	
      kind: Gateway
      name: crobasaurusrex-gateway
      namespace: gateways
  hostnames:
    - zwavejs.crobceratops.ryanbeales.com
    - zwavejs.crobasaurusrex.ryanbeales.com
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - group: ''	
          kind: Service
          name: zwavejs-zwavejs2mqtt
          port: 8091
          weight: 1