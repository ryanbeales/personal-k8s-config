kind: Deployment
apiVersion: apps/v1
metadata:
  name: samba
  namespace: samba
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      name: samba
      labels:
        app: samba
    spec:
      nodeSelector:
        # Only run on crobasaurusrex, which has the disk storage.
        kubernetes.io/hostname: crobasaurusrex
      containers:
        - name: samba
          # renovate: datasource=docker depname=ghcr.io/servercontainers/samba versioning=loose
          image: ghcr.io/servercontainers/samba:a3.24.4-s4.23.8-r0
          env:
            - name: TZ
              value: "America/Vancouver"              

            - name: ACCOUNT_ryan
              value: "samba123412341234"
            - name: UID_ryan
              value: "1000"

            - name: ACCOUNT_melissa
              value: "samba123412341234"
            - name: UID_melissa
              value: "1001"
            # Add gid=1000 to Melissa account
            - name: GROUPS_melissa
              value: "ryan"
            
            - name: SAMBA_CONF_LOG_LEVEL
              value: "3"

            - name: SAMBA_VOLUME_CONFIG_timemachine
              value: | 
                [TimeMachine]
                path=/shares/timemachine/%U
                valid users = melissa
                guest ok = no
                read only = no
                browseable = yes
                fruit:time machine = yes
                fruit:time machine max size = 1024G

            - name: SAMBA_VOLUME_CONFIG_stash
              value: |
                [stash]
                path = /shares/stash
                read only = no
                browsable = yes
                guest ok = no
                valid users = ryan, melissa
                create mask = 0660
                directory mask = 0770
          volumeMounts:
            - mountPath: /shares/stash
              name: stash
          securityContext:
            privileged: true
      # Allow samba to bind to the hosts network.
      hostNetwork: true
      volumes:
        - name: stash
          hostPath:
            # Copied from QNAP migration.
            path: /stash/network-storage/qnap
            type: DirectoryOrCreate
