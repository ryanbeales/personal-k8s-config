apiVersion: v1
kind: Service
metadata:
  name: windmill-extra
  namespace: windmill
  labels:
    app.kubernetes.io/name: windmill-extra
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: gateway
      protocol: TCP
      name: gateway
    - port: 3001
      targetPort: lsp
      protocol: TCP
      name: lsp
    - port: 3003
      targetPort: debugger
      protocol: TCP
      name: debugger
  selector:
    app.kubernetes.io/name: windmill-extra
