apiVersion: v1
kind: Service
metadata:
  name: windmill
  namespace: windmill
  labels:
    app.kubernetes.io/name: windmill
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
    - port: 8001
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: windmill
