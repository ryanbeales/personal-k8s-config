apiVersion: apps/v1
kind: Deployment
metadata:
  name: windmill-worker
  namespace: windmill
  labels:
    app.kubernetes.io/name: windmill-worker
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: windmill-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windmill-worker
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h windmill-postgres.windmill.svc.cluster.local -p 5432 -U postgres -d windmill; do
                echo "Waiting for windmill-postgres..."
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: windmill-worker
          # renovate: datasource=docker depname=ghcr.io/windmill-labs/windmill versioning=semver
          image: ghcr.io/windmill-labs/windmill:1.873.1
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: "worker"
            - name: WORKER_GROUP
              value: "default"
            - name: DATABASE_URL
              value: "postgres://postgres:windmill@windmill-postgres.windmill.svc.cluster.local:5432/windmill?sslmode=disable"
            - name: BASE_URL
              value: "https://windmill.crobasaurusrex.ryanbeales.com"
            - name: ALLOW_PRIVATE_AI_BASE_URLS
              value: "true"
            - name: JSON_FMT
              value: "true"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -d /proc/1
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -d /proc/1
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: storage
              mountPath: /tmp/windmill/cache
              subPath: worker-cache
            - name: storage
              mountPath: /tmp/windmill/logs
              subPath: worker-logs
        - name: windmill-worker-native
          # renovate: datasource=docker depname=ghcr.io/windmill-labs/windmill versioning=semver
          image: ghcr.io/windmill-labs/windmill:1.873.1
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: "worker"
            - name: WORKER_GROUP
              value: "native"
            - name: NATIVE_MODE
              value: "true"
            - name: SLEEP_QUEUE
              value: "200"
            - name: DATABASE_URL
              value: "postgres://postgres:windmill@windmill-postgres.windmill.svc.cluster.local:5432/windmill?sslmode=disable"
            - name: BASE_URL
              value: "https://windmill.crobasaurusrex.ryanbeales.com"
            - name: ALLOW_PRIVATE_AI_BASE_URLS
              value: "true"
            - name: JSON_FMT
              value: "true"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -d /proc/1
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -d /proc/1
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: storage
              mountPath: /tmp/windmill/logs
              subPath: worker-logs
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: windmill-nfs-pvc
