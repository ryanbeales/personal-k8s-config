apiVersion: v1
kind: Service
metadata:
  name: windmill-postgres
  namespace: windmill
  labels:
    app.kubernetes.io/name: windmill-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: windmill-postgres
