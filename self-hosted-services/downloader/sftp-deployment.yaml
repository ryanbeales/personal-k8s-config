apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: downloader
  creationTimestamp: null
  labels:
    io.kompose.service: sftp
  name: sftp
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: sftp
  template:
    metadata:
      labels:
        io.kompose.service: sftp
        app: sftp
    spec:
      containers:
      - name: sftp
        # renovate: datasource=docker depname=docker.io/atmoz/sftp versioning=docker
        image: docker.io/atmoz/sftp:latest@sha256:6adee9cb7218db1ed7ae7bb4a23677532786eb06997534d9788378001c38447a
        env:
        - name: SFTP_USERS
          value: "user:pass:1000:1000"
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: no-nonsense-webdav-storage
          mountPath: /home/user/downloads
          subPath: downloads
        - name: no-nonsense-webdav-storage
          mountPath: /home/user/tv
          subPath: tv
        - name: stashplex
          mountPath: /home/user/plex
        - name: stashpiframe
          mountPath: /home/user/piframe
        ports:
        - containerPort: 22
      volumes:
      - name: no-nonsense-webdav-storage
        persistentVolumeClaim:
          claimName: downloader-pvc
      - name: stashplex
        hostPath:
          # Copied from QNAP migration.
          path: /stash/network-storage/qnap/Plex
          type: DirectoryOrCreate
      - name: stashpiframe
        hostPath:
          # Tempoary mount here
          path: /stash/network-storage/qnap/Photos/PiFrame/Photos
          type: DirectoryOrCreate
