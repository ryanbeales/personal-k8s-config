apiVersion: apps/v1
kind: Deployment
metadata:
  name: klipper
  namespace: klipper
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: klipper
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: klipper
        app.kubernetes.io/component: core
    spec:
      nodeSelector:
        kubernetes.io/hostname: crobceratops
      volumes:
        - name: klipper-pvc
          persistentVolumeClaim:
            claimName: klipper-pvc
        - name: klipper-config
          configMap:
            name: klipper-config
        - name: ttyacm0
          hostPath:
            path: /dev/serial/by-id/usb-marlinfw.org_Marlin_USB_Device_0800D001AF48A4E55D37A3EBF50020C4-if00
      initContainers:
        - name: init-permissions
          # renovate: datasource=docker depname=busybox versioning=semver
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /home/klippy/printer_data/comms /home/klippy/printer_data/config /home/klippy/printer_data/gcodes /home/klippy/printer_data/logs /home/klippy/printer_data/firmware /home/klippy/.config
              chmod -R 777 /home/klippy/printer_data /home/klippy/.config
              echo "z_calibration" > /home/klippy/printer_data/moonraker.asvc
          volumeMounts:
            - mountPath: /home/klippy/printer_data
              name: klipper-pvc
      containers:
        - name: klipper
          # renovate: datasource=docker depname=dimalo/klipper-moonraker versioning=semver
          image: dimalo/klipper-moonraker:latest
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              if [ -d /home/klippy/moonraker ]; then
                git config --global --add safe.directory /home/klippy/moonraker
                (cd /home/klippy/moonraker && git pull origin master || true)
              fi
              exec supervisord -c /etc/supervisord/conf.d/supervisord.conf
          ports:
            - containerPort: 7125
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - mountPath: /home/klippy/printer_data
              name: klipper-pvc
            - mountPath: /home/klippy/printer_data/config/printer.cfg
              name: klipper-config
              subPath: klipper.cfg
            - mountPath: /home/klippy/printer_data/config/moonraker.conf
              name: klipper-config
              subPath: moonraker.conf
            - mountPath: /home/klippy/.config/printer.cfg
              name: klipper-config
              subPath: klipper.cfg
            - mountPath: /home/klippy/.config/moonraker.conf
              name: klipper-config
              subPath: moonraker.conf
            - mountPath: /etc/supervisord/klipper.ini
              name: klipper-config
              subPath: klipper.ini
            - mountPath: /etc/supervisord/moonraker.ini
              name: klipper-config
              subPath: moonraker.ini
            - mountPath: /dev/ttyACM0
              name: ttyacm0
