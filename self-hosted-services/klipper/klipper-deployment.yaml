apiVersion: apps/v1
kind: Deployment
metadata:
  name: klipper
  namespace: klipper
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: klipper
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: klipper
        app.kubernetes.io/component: core
    spec:
      nodeSelector:
        feature.node.kubernetes.io/usb-biqu-b1: "true"
      volumes:
        - name: klipper-pvc
          persistentVolumeClaim:
            claimName: klipper-pvc
        - name: klipper-config
          configMap:
            name: klipper-config
        - name: ttyacm0
          hostPath:
            path: /dev/serial/by-id/usb-Klipper_lpc1768_01D00008E5A448AFEBA3375DC42000F5-if00
            type: CharDevice
        - name: socket-dir
          emptyDir: {}
      initContainers:
        - name: init-dirs
          # renovate: datasource=docker depname=busybox versioning=semver
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "set -e -x; mkdir -p /opt/printer_data/config /opt/printer_data/logs /opt/printer_data/gcodes /opt/printer_data/run /opt/printer_data/comms; chown -R 1000:1000 /opt/printer_data || true; chmod -R 777 /opt/printer_data || true; if [ ! -f /opt/printer_data/config/printer.cfg ]; then cat /tmp/config/klipper.cfg > /opt/printer_data/config/printer.cfg; fi; if [ ! -f /opt/printer_data/config/moonraker.conf ]; then cat /tmp/config/moonraker.conf > /opt/printer_data/config/moonraker.conf; fi; chown -R 1000:1000 /opt/printer_data || true; chmod -R 777 /opt/printer_data || true"
          volumeMounts:
            - mountPath: /opt/printer_data
              name: klipper-pvc
            - mountPath: /tmp/config
              name: klipper-config
      containers:
        - name: klipper
          # renovate: datasource=docker depname=mkuf/klipper versioning=semver
          image: mkuf/klipper:latest
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - mountPath: /opt/printer_data
              name: klipper-pvc
            - mountPath: /opt/printer_data/run
              name: socket-dir
            - mountPath: /dev/ttyACM0
              name: ttyacm0
        - name: moonraker
          # renovate: datasource=docker depname=mkuf/moonraker versioning=semver
          image: mkuf/moonraker:latest
          ports:
            - containerPort: 7125
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - mountPath: /opt/printer_data
              name: klipper-pvc
            - mountPath: /opt/printer_data/run
              name: socket-dir
