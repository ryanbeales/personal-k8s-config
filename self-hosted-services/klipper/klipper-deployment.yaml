apiVersion: apps/v1
kind: Deployment
metadata:
  name: klipper
  namespace: klipper
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: klipper
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: klipper
        app.kubernetes.io/component: core
    spec:
      nodeSelector:
        feature.node.kubernetes.io/usb-biqu-b1: "true"
      volumes:
        - name: klipper-pvc
          persistentVolumeClaim:
            claimName: klipper-pvc
        - name: klipper-config
          configMap:
            name: klipper-config
        - name: ttyacm0
          hostPath:
            path: /dev/ttyACM0
      initContainers:
        - name: init-dirs
          # renovate: datasource=docker depname=busybox versioning=semver
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - mkdir -p /opt/printer_data/config /opt/printer_data/logs /opt/printer_data/comms /opt/printer_data/run /opt/printer_data/gcodes && chmod -R 777 /opt/printer_data && rm -rf /opt/printer_data/config/printer.cfg
          volumeMounts:
            - mountPath: /opt/printer_data
              name: klipper-pvc
      containers:
        - name: klipper
          # renovate: datasource=docker depname=mkuf/klipper versioning=semver
          image: mkuf/klipper:latest
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - mountPath: /opt/printer_data
              name: klipper-pvc
            - mountPath: /opt/printer_data/config/printer.cfg
              name: klipper-config
              subPath: klipper.cfg
            - mountPath: /dev/ttyACM0
              name: ttyacm0
