apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainsail
  namespace: klipper
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mainsail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mainsail
    spec:
      containers:
        - name: mainsail
          # renovate: datasource=docker depname=ghcr.io/mainsail-crew/mainsail versioning=semver
          image: ghcr.io/mainsail-crew/mainsail:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
