apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: obico-route
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Obico"
    gethomepage.dev/group: "Media & Self-Hosted"
    gethomepage.dev/icon: "obico.png"
    gethomepage.dev/description: "AI 3D printer failure detection"
  namespace: obico
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: crobceratops-gateway
      namespace: gateways
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: crobasaurusrex-gateway
      namespace: gateways
  hostnames:
    - obico.crobceratops.ryanbeales.com
    - obico.crobasaurusrex.ryanbeales.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: obico-web
          port: 3334
          weight: 1
