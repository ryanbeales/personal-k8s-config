apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: memos-route
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Memos"
    gethomepage.dev/group: "Media & Self-Hosted"
    gethomepage.dev/icon: "memos.png"
    gethomepage.dev/description: "Lightweight note-taking service"
  namespace: memos
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: crobceratops-gateway
      namespace: gateways
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: crobasaurusrex-gateway
      namespace: gateways
  hostnames:
    - memos.crobceratops.ryanbeales.com
    - memos.crobasaurusrex.ryanbeales.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: memos-service
          port: 5230
          weight: 1
