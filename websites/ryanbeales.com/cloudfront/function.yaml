apiVersion: cloudfront.aws.upbound.io/v1beta1
kind: Function
metadata:
  name: www-ryanbeales-com-rewrite
spec:
  forProvider:
    runtime: cloudfront-js-1.0
    publish: true
    codeSecretRef:
      name: www-ryanbeales-com-rewrite-code
      namespace: ryanbeales-com
      key: code
    # Created many years ago in us-east-1 before moving closer to us-west-2 (CloudFront control plane also uses us-east-1).
    region: us-east-1
  providerConfigRef:
    name: upbound-aws-default
