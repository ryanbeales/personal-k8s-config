name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p $HOME/bin
          echo "$HOME/bin" >> $GITHUB_PATH
          
          # Install dyff
          DYFF_VERSION=$(curl -sH "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/homeport/dyff/releases/latest | jq -r .tag_name)
          curl -L "https://github.com/homeport/dyff/releases/download/${DYFF_VERSION}/dyff_${DYFF_VERSION#v}_linux_amd64.tar.gz" | tar xz dyff
          mv dyff $HOME/bin/

          # Install kubeconform
          KC_VERSION=$(curl -sH "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/yannh/kubeconform/releases/latest | jq -r .tag_name)
          curl -L "https://github.com/yannh/kubeconform/releases/download/${KC_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          mv kubeconform $HOME/bin/

          # Install pluto
          PLUTO_VERSION=$(curl -sH "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/FairwindsOps/pluto/releases/latest | jq -r .tag_name)
          curl -L "https://github.com/FairwindsOps/pluto/releases/download/${PLUTO_VERSION}/pluto_${PLUTO_VERSION#v}_linux_amd64.tar.gz" | tar xz pluto
          mv pluto $HOME/bin/

          # Install kube-linter
          KL_VERSION=$(curl -sH "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/stackrox/kube-linter/releases/latest | jq -r .tag_name)
          curl -L "https://github.com/stackrox/kube-linter/releases/download/${KL_VERSION}/kube-linter-linux.tar.gz" | tar xz kube-linter
          mv kube-linter $HOME/bin/

      - name: Get Changed Directories
        id: changed-dirs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          DIRS=$(git diff --name-only "origin/${BASE_REF}...HEAD" | xargs -r -n1 dirname | grep -v '^\.$' | sort -u | tr '\n' ' ')
          echo "all_changed_files=${DIRS}" >> "$GITHUB_OUTPUT"

      - name: Cache Kubeconform Schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/kubeconform-cache
          key: ${{ runner.os }}-kubeconform-schemas-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kubeconform-schemas-

      - name: Build and Validate
        id: build-validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_DIRS: ${{ steps.changed-dirs.outputs.all_changed_files }}
        run: |
          mkdir -p /tmp/kubeconform-cache
          bash .github/workflows/scripts/validate_manifests.sh "$CHANGED_DIRS"

      - name: Post Comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        if: always()
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: pr-validation-report.md
