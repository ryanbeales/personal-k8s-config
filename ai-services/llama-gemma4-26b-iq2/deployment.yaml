apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-gemma4-26b-iq2
  namespace: llama
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-gemma4-26b-iq2
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-gemma4-26b-iq2
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-GeForce-RTX-5060-Ti
      initContainers:
        - name: download-model
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /models/gemma-4-26B-A4B-it-UD-IQ2_M.gguf ]; then
                echo "Downloading unsloth/gemma-4-26B-A4B-it-GGUF (IQ2_M)..."
                curl -L -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" \
                  -o /models/gemma-4-26B-A4B-it-UD-IQ2_M.gguf \
                  "https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/main/gemma-4-26B-A4B-it-UD-IQ2_M.gguf"
              else
                echo "Model gemma-4-26B-A4B-it-UD-IQ2_M.gguf already downloaded."
              fi
              if [ ! -f /models/mtp-gemma-4-26B-A4B-it.gguf ]; then
                echo "Downloading MTP drafter mtp-gemma-4-26B-A4B-it.gguf..."
                curl -L -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" \
                  -o /models/mtp-gemma-4-26B-A4B-it.gguf \
                  "https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/main/mtp-gemma-4-26B-A4B-it.gguf"
              else
                echo "MTP drafter already downloaded."
              fi
              if [ ! -f /models/gemma-4-26B-A4B-it-mmproj-F16.gguf ]; then
                echo "Downloading vision projector mmproj-F16.gguf..."
                curl -L -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" \
                  -o /models/gemma-4-26B-A4B-it-mmproj-F16.gguf \
                  "https://huggingface.co/unsloth/gemma-4-26B-A4B-it-qat-GGUF/resolve/main/mmproj-F16.gguf"
              else
                echo "Vision projector already downloaded."
              fi
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true
          volumeMounts:
            - name: cache-volume
              mountPath: /models
      containers:
        - name: llama-cpp
          # renovate: datasource=docker depname=ghcr.io/ggml-org/llama.cpp versioning=loose
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command: ["/bin/sh", "-c"]
          args:
            - |
              /app/llama-server \
                -m /models/gemma-4-26B-A4B-it-UD-IQ2_M.gguf \
                --mmproj /models/gemma-4-26B-A4B-it-mmproj-F16.gguf \
                --model-draft /models/mtp-gemma-4-26B-A4B-it.gguf \
                --spec-type draft-mtp \
                --spec-draft-n-max 3 \
                -c 16384 \
                -np 1 \
                -ctk q4_0 \
                -ctv q4_0 \
                --flash-attn on \
                -ngl 99 \
                -n 4096 \
                --alias llama-gemma4-26b-iq2 \
                --host 0.0.0.0 \
                --port 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: cache-volume
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: llama-gemma4-26b-iq2-nfs-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
