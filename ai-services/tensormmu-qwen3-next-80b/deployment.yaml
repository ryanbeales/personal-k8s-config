apiVersion: apps/v1
kind: Deployment
metadata:
  name: tensormmu-qwen3-next-80b
  namespace: llama
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tensormmu-qwen3-next-80b
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tensormmu-qwen3-next-80b
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: crobputer
      tolerations:
        - key: dedicated
          operator: Equal
          value: crobputer
          effect: NoSchedule
      containers:
        - name: tensormmu
          # renovate: datasource=docker depname=ghcr.io/ryanbeales/tensormmu versioning=loose
          image: ghcr.io/ryanbeales/tensormmu:latest
          imagePullPolicy: Always
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--fail-livez-on-error"
          env:
            - name: TMMU_MODEL
              value: "Qwen/Qwen3-Next-80B-A3B-Instruct"
            - name: TMMU_DEFAULT_MAX_TOKENS
              value: "32768"
            - name: TMMU_THINKING_BUDGET
              value: "6144"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          ports:
            - name: http
              containerPort: 8000
          # Liveness succeeds immediately (200 OK) while background download/compile runs,
          # and returns 500 only if bootstrap hits an unrecoverable error (--fail-livez-on-error).
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          # Readiness stays 503 while downloading/compiling/loading so Kubernetes Service
          # holds traffic until the cartridge is warm in GPU VRAM + L2 Zero-Copy RAM.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 360
          volumeMounts:
            - name: models-volume
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models-volume
          persistentVolumeClaim:
            claimName: tensormmu-qwen3-next-80b-local-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
