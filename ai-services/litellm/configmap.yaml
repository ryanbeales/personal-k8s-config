apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      # Explicit individual models
      - model_name: llama-bonsai-2-27b-1bit
        litellm_params:
          model: openai/llama-bonsai-2-27b-1bit
          api_base: http://llama-bonsai-2-27b-1bit.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
          max_parallel_requests: 1
      - model_name: llama-bonsai-2-27b-2bit
        litellm_params:
          model: openai/llama-bonsai-2-27b-2bit
          api_base: http://llama-bonsai-2-27b-2bit.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
          max_parallel_requests: 1
      - model_name: assistant-e3b
        litellm_params:
          model: openai/gemma-4-E4B_q4_0-it.gguf
          api_base: http://llama-gemma4-e4b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
          max_parallel_requests: 2
      - model_name: gemma-4-E4B
        litellm_params:
          model: openai/gemma-4-E4B_q4_0-it.gguf
          api_base: http://llama-gemma4-e4b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
          max_parallel_requests: 2
      - model_name: faster-whisper
        litellm_params:
          model: openai/whisper-1
          api_base: http://faster-whisper.faster-whisper.svc.cluster.local:10300/v1
          api_key: "sk-no-key"
      - model_name: omnivoice
        litellm_params:
          model: openai/tts-1
          api_base: http://omnivoice.omnivoice.svc.cluster.local:8880/v1
          api_key: "sk-no-key"
      - model_name: kokoro
        litellm_params:
          model: openai/tts-1
          api_base: http://kokoro.kokoro.svc.cluster.local:8880/v1
          api_key: "sk-no-key"
      - model_name: gemini-3.7-flash
        litellm_params:
          model: gemini/gemini-3.7-flash
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: gemini-3.7
        litellm_params:
          model: gemini/gemini-3.7-flash
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: gemini-3.8-flash
        litellm_params:
          model: gemini/gemini-3.8-flash
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: gemini-3.8
        litellm_params:
          model: gemini/gemini-3.8-flash
          api_key: "os.environ/GEMINI_API_KEY"

      # Routing Groups (Aliases)
      
      # "agent" group: Hermes & general agents (4090 1-bit instance, thinking enabled)
      - model_name: agent
        litellm_params:
          model: openai/llama-bonsai-2-27b-1bit
          api_base: http://llama-bonsai-2-27b-1bit.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"

      # "vision" group: Frigate camera descriptions (5060 Ti 2-bit instance, thinking disabled)
      - model_name: vision
        litellm_params:
          model: openai/llama-bonsai-2-27b-2bit
          api_base: http://llama-bonsai-2-27b-2bit.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
          extra_body:
            enable_thinking: false

      # "assistant" group: Home Assistant voice assistant (5060 Ti 2-bit instance, thinking disabled)
      - model_name: assistant
        litellm_params:
          model: openai/llama-bonsai-2-27b-2bit
          api_base: http://llama-bonsai-2-27b-2bit.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
          extra_body:
            enable_thinking: false

      # "code" group: Coding & developer tasks (4090 1-bit instance)
      - model_name: code
        litellm_params:
          model: openai/llama-bonsai-2-27b-1bit
          api_base: http://llama-bonsai-2-27b-1bit.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"

      # "stt" group
      - model_name: stt
        litellm_params:
          model: openai/whisper-1
          api_base: http://faster-whisper.faster-whisper.svc.cluster.local:10300/v1
          api_key: "sk-no-key"

      # "tts" group
      - model_name: tts
        litellm_params:
          model: openai/tts-1
          api_base: http://kokoro.kokoro.svc.cluster.local:8880/v1
          api_key: "sk-no-key"
      - model_name: tts-1
        litellm_params:
          model: openai/tts-1
          api_base: http://kokoro.kokoro.svc.cluster.local:8880/v1
          api_key: "sk-no-key"

    router_settings:
      routing_strategy: "latency-based-routing"
      fallbacks:
        - {"agent": ["llama-bonsai-2-27b-2bit", "gemini-3.8-flash"]}
        - {"vision": ["assistant-e3b", "gemini-3.8-flash"]}
        - {"assistant": ["assistant-e3b", "gemini-3.8-flash"]}
        - {"code": ["gemini-3.8-flash"]}
        - {"tts": ["omnivoice"]}

    litellm_settings:
      callbacks:
        - prometheus
      require_auth_for_metrics_endpoint: false
