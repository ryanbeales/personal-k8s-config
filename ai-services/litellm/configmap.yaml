apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      # Explicit individual models
      - model_name: qwen3.8-27B
        litellm_params:
          model: openai/Qwen3.8-27B-UD-Q4_K_M.gguf
          api_base: http://llama-qwen3-8-27b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
          max_parallel_requests: 2
      - model_name: gemma-4-12B
        litellm_params:
          model: openai/gemma-4-12b-it-qat-q4_0.gguf
          api_base: http://llama-gemma4-12b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
          max_parallel_requests: 1
      - model_name: gemma-4-12b
        litellm_params:
          model: openai/gemma-4-12b-it-qat-q4_0.gguf
          api_base: http://llama-gemma4-12b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
          max_parallel_requests: 1
      - model_name: gemma-4-E4B
        litellm_params:
          model: openai/gemma-4-E4B_q4_0-it.gguf
          api_base: http://llama-gemma4-e4b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
          max_parallel_requests: 2
      - model_name: gemma-4-e4b
        litellm_params:
          model: openai/gemma-4-E4B_q4_0-it.gguf
          api_base: http://llama-gemma4-e4b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
          max_parallel_requests: 2
      - model_name: faster-whisper
        litellm_params:
          model: openai/whisper-1
          api_base: http://faster-whisper.faster-whisper.svc.cluster.local:10300/v1
          api_key: "sk-no-key"
      - model_name: omnivoice
        litellm_params:
          model: openai/tts-1
          api_base: http://omnivoice.omnivoice.svc.cluster.local:8880/v1
          api_key: "sk-no-key"
      - model_name: kokoro
        litellm_params:
          model: openai/tts-1
          api_base: http://kokoro.kokoro.svc.cluster.local:8880/v1
          api_key: "sk-no-key"
      - model_name: gemini-3.7-flash
        litellm_params:
          model: gemini/gemini-3.7-flash
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: gemini-3.7
        litellm_params:
          model: gemini/gemini-3.7-flash
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: gemini-3.8-flash
        litellm_params:
          model: gemini/gemini-3.8-flash
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: gemini-3.8
        litellm_params:
          model: gemini/gemini-3.8-flash
          api_key: "os.environ/GEMINI_API_KEY"

      # Routing Groups (Aliases)
      
      # "agent" group: Strict fallback chain (Qwen3.8-27B -> 12B -> E4B)
      - model_name: agent
        litellm_params:
          model: openai/Qwen3.8-27B-UD-Q4_K_M.gguf
          api_base: http://llama-qwen3-8-27b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"

      # "vision" group: Latency-based routing between E4B and 12B
      - model_name: vision
        litellm_params:
          model: openai/gemma-4-E4B_q4_0-it.gguf
          api_base: http://llama-gemma4-e4b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
      - model_name: vision
        litellm_params:
          model: openai/gemma-4-12b-it-qat-q4_0.gguf
          api_base: http://llama-gemma4-12b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"

      # "assistant" group: Latency-based routing between 12B and E4B
      - model_name: assistant
        litellm_params:
          model: openai/gemma-4-12b-it-qat-q4_0.gguf
          api_base: http://llama-gemma4-12b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"
      - model_name: assistant
        litellm_params:
          model: openai/gemma-4-E4B_q4_0-it.gguf
          api_base: http://llama-gemma4-e4b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"

      # "code" group
      - model_name: code
        litellm_params:
          model: openai/Qwen3.8-27B-UD-Q4_K_M.gguf
          api_base: http://llama-qwen3-8-27b.llama.svc.cluster.local:8000/v1
          api_key: "sk-no-key"

      # "stt" group
      - model_name: stt
        litellm_params:
          model: openai/whisper-1
          api_base: http://faster-whisper.faster-whisper.svc.cluster.local:10300/v1
          api_key: "sk-no-key"

      # "tts" group
      - model_name: tts
        litellm_params:
          model: openai/tts-1
          api_base: http://kokoro.kokoro.svc.cluster.local:8880/v1
          api_key: "sk-no-key"
      - model_name: tts-1
        litellm_params:
          model: openai/tts-1
          api_base: http://kokoro.kokoro.svc.cluster.local:8880/v1
          api_key: "sk-no-key"

    router_settings:
      routing_strategy: "latency-based-routing"
      fallbacks:
        - {"agent": ["gemma-4-12B", "gemma-4-E4B", "gemini-3.8-flash"]}
        - {"qwen3.8-27B": ["gemma-4-12B", "gemma-4-E4B", "gemini-3.8-flash"]}
        - {"gemma-4-12B": ["gemma-4-E4B", "gemini-3.8-flash"]}
        - {"gemma-4-12b": ["gemma-4-e4b", "gemini-3.8-flash"]}
        - {"gemma-4-E4B": ["gemini-3.8-flash"]}
        - {"gemma-4-e4b": ["gemini-3.8-flash"]}
        - {"vision": ["gemini-3.8-flash"]}
        - {"assistant": ["gemini-3.8-flash"]}
        - {"code": ["gemini-3.8-flash"]}
        - {"tts": ["omnivoice"]}

    litellm_settings:
      callbacks:
        - prometheus
      require_auth_for_metrics_endpoint: false
