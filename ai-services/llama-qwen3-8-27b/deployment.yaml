apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-qwen3-8-27b
  namespace: llama
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-qwen3-8-27b
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-qwen3-8-27b
    spec:
      runtimeClassName: nvidia
      nodeName: crobputer
      tolerations:
        - key: dedicated
          operator: Equal
          value: crobputer
          effect: NoSchedule
      initContainers:
        - name: download-model
          image: curlimages/curl:latest
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              if [ ! -f /models/Qwen3.8-27B-UD-Q4_K_M.gguf ]; then
                echo "Downloading unsloth/Qwen3.8-27B-GGUF (UD-Q4_K_M)..."
                curl -L -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" -o /models/Qwen3.8-27B-UD-Q4_K_M.gguf "https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q4_K_M.gguf"
              else
                echo "Model already downloaded."
              fi
              if [ ! -f /models/mmproj-F16.gguf ]; then
                echo "Downloading vision projector mmproj-F16.gguf..."
                curl -L -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" -o /models/mmproj-F16.gguf "https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/mmproj-F16.gguf"
              fi
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true
          volumeMounts:
            - name: cache-volume
              mountPath: /models
      containers:
        - name: llama-cpp
          # renovate: datasource=docker depname=ghcr.io/ggml-org/llama.cpp versioning=loose
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command: ["/bin/sh", "-c"]
          args:
            - |
              /app/llama-server \
                -m /models/Qwen3.8-27B-UD-Q4_K_M.gguf \
                --mmproj /models/mmproj-F16.gguf \
                -c 131072 \
                -ctk q4_0 \
                -ctv q4_0 \
                --flash-attn on \
                -ngl -1 \
                --host 0.0.0.0 \
                --port 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: cache-volume
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: llama-qwen3.8-27b-nfs-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
