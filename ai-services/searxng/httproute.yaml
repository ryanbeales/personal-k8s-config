apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: searxng-route
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "SearXNG"
    gethomepage.dev/group: "AI & Automation"
    gethomepage.dev/icon: "searxng.png"
    gethomepage.dev/description: "Privacy-respecting metasearch engine"
  namespace: searxng   
spec:
  parentRefs:
    - group: gateway.networking.k8s.io	
      kind: Gateway
      name: crobceratops-gateway
      namespace: gateways
    - group: gateway.networking.k8s.io	
      kind: Gateway
      name: crobasaurusrex-gateway
      namespace: gateways
  hostnames:
    - searxng.crobceratops.ryanbeales.com
    - searxng.crobasaurusrex.ryanbeales.com
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - group: ''	
          kind: Service
          name: searxng
          port: 8080
          weight: 1