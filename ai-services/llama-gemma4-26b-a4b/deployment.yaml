apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-gemma4-26b-a4b
  namespace: llama
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-gemma4-26b-a4b
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-gemma4-26b-a4b
    spec:
      runtimeClassName: nvidia
      nodeName: crobputer
      tolerations:
        - key: dedicated
          operator: Equal
          value: crobputer
          effect: NoSchedule
      initContainers:
        - name: download-model
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /models/Qwen3.8-27B-UD-IQ4_XS.gguf ]; then
                echo "Downloading unsloth/Qwen3.8-27B-GGUF (UD-IQ4_XS)..."
                curl -L -C - -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" \
                  -o /models/Qwen3.8-27B-UD-IQ4_XS.gguf \
                  "https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-IQ4_XS.gguf"
              else
                echo "Model Qwen3.8-27B-UD-IQ4_XS.gguf already downloaded."
              fi
              if [ ! -f /models/mtp-Qwen3.8-27B-Q4_0.gguf ]; then
                echo "Downloading MTP drafter mtp-Qwen3.8-27B-Q4_0.gguf..."
                curl -L -C - -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" \
                  -o /models/mtp-Qwen3.8-27B-Q4_0.gguf \
                  "https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/MTP/mtp-Qwen3.8-27B-Q4_0.gguf"
              else
                echo "MTP drafter mtp-Qwen3.8-27B-Q4_0.gguf already downloaded."
              fi
              if [ ! -f /models/qwen3.8-27b-mmproj-BF16.gguf ]; then
                echo "Downloading vision projector mmproj-BF16.gguf..."
                curl -L -C - -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" \
                  -o /models/qwen3.8-27b-mmproj-BF16.gguf \
                  "https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/mmproj-BF16.gguf"
              else
                echo "Vision projector already downloaded."
              fi
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true
          volumeMounts:
            - name: cache-volume
              mountPath: /models
      containers:
        - name: llama-cpp
          # renovate: datasource=docker depname=ghcr.io/ggml-org/llama.cpp versioning=loose
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command: ["/bin/sh", "-c"]
          args:
            - |
              /app/llama-server \
                -m /models/Qwen3.8-27B-UD-IQ4_XS.gguf \
                --mmproj /models/qwen3.8-27b-mmproj-BF16.gguf \
                --model-draft /models/mtp-Qwen3.8-27B-Q4_0.gguf \
                --spec-type draft-mtp \
                --spec-draft-n-max 3 \
                -c 65536 \
                -np 1 \
                -ctk q4_0 \
                -ctv q4_0 \
                --flash-attn on \
                -ngl 99 \
                -n 8192 \
                --alias Qwen3.8-27B-UD-IQ4_XS.gguf \
                --host 0.0.0.0 \
                --port 8000
          env:
            - name: GGML_CUDA_GRAPH_OPT
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: cache-volume
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: llama-gemma4-26b-a4b-nfs-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
