apiVersion: apps/v1
kind: Deployment
metadata:
  name: magnitude-gemma4-26b-a4b
  namespace: llama
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: magnitude-gemma4-26b-a4b
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magnitude-gemma4-26b-a4b
    spec:
      runtimeClassName: nvidia
      nodeName: crobputer
      tolerations:
        - key: dedicated
          operator: Equal
          value: crobputer
          effect: NoSchedule
      initContainers:
        - name: setup-magnitude
          # renovate: datasource=docker depname=ghcr.io/ggml-org/llama.cpp versioning=loose
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              MAGNITUDE_DIR="/models/magnitude"
              if [ ! -f "$MAGNITUDE_DIR/bin/magnitude-inference" ]; then
                echo "Downloading Magnitude..."
                mkdir -p "$MAGNITUDE_DIR"
                curl -sSL "https://github.com/magnitudedev/magnitude/releases/download/@magnitudedev/cli@0.2.3/magnitude-icn-base-linux-x64-gnu.tar.gz" | tar -xz -C "$MAGNITUDE_DIR"
                printf '{"schemaVersion":1,"nativeBuild":"0.1.0+src.3cc3838e83767a1f232f223b"}' > "$MAGNITUDE_DIR/installation.json"
                chmod +x "$MAGNITUDE_DIR/bin/magnitude-inference"
              fi

              if [ ! -f "$MAGNITUDE_DIR/bin/magnitude" ]; then
                echo "Downloading Magnitude CLI..."
                curl -sSL "https://github.com/magnitudedev/magnitude/releases/download/@magnitudedev/cli@0.2.3/magnitude-cli-linux-x64-gnu.tar.gz" | tar -xz -C "$MAGNITUDE_DIR"
                chmod +x "$MAGNITUDE_DIR/bin/magnitude" || true
              fi

              if [ ! -f /models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf ]; then
                echo "Downloading unsloth/gemma-4-26B-A4B-it-GGUF (Q4_K_M)..."
                curl -L -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" \
                  -o /models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf \
                  "https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/main/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf"
              else
                echo "Model gemma-4-26B-A4B-it-UD-Q4_K_M.gguf already downloaded."
              fi
              if [ ! -f /models/mtp-gemma-4-26B-A4B-it.gguf ]; then
                echo "Downloading MTP drafter mtp-gemma-4-26B-A4B-it.gguf..."
                curl -L -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" \
                  -o /models/mtp-gemma-4-26B-A4B-it.gguf \
                  "https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/main/mtp-gemma-4-26B-A4B-it.gguf"
              else
                echo "MTP drafter already downloaded."
              fi
              if [ ! -f /models/gemma-4-26B-A4B-it-mmproj-F16.gguf ]; then
                echo "Downloading vision projector mmproj-F16.gguf..."
                curl -L -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" \
                  -o /models/gemma-4-26B-A4B-it-mmproj-F16.gguf \
                  "https://huggingface.co/unsloth/gemma-4-26B-A4B-it-qat-GGUF/resolve/main/mmproj-F16.gguf"
              else
                echo "Vision projector already downloaded."
              fi

              for repo in "models--unsloth--gemma-4-26B-A4B-it-GGUF" "models--unsloth--gemma-4-26B-A4B-it-qat-GGUF"; do
                HF_REPO="/models/hub/$repo"
                mkdir -p "$HF_REPO/snapshots/main" "$HF_REPO/refs"
                printf 'main' > "$HF_REPO/refs/main"
                for f in gemma-4-26B-A4B-it-UD-Q4_K_M.gguf gemma-4-26B-A4B-it-mmproj-F16.gguf mtp-gemma-4-26B-A4B-it.gguf; do
                  if [ -f "/models/$f" ] && [ ! -f "$HF_REPO/snapshots/main/$f" ]; then
                    ln "/models/$f" "$HF_REPO/snapshots/main/$f" || cp "/models/$f" "$HF_REPO/snapshots/main/$f"
                  fi
                done
              done
              echo "Setup complete."
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true
          volumeMounts:
            - name: cache-volume
              mountPath: /models
      containers:
        - name: magnitude
          # renovate: datasource=docker depname=ghcr.io/ggml-org/llama.cpp versioning=loose
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command: ["/bin/sh", "-c"]
          args:
            - |
              export LD_LIBRARY_PATH=/models/magnitude/runtime:$LD_LIBRARY_PATH
              exec /models/magnitude/bin/magnitude-inference serve \
                --installation /models/magnitude/installation.json \
                --bind 0.0.0.0:8000 \
                --model-store /models/store \
                --hf-cache /models/hub \
                --cache-root /models/cache
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: cache-volume
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: llama-gemma4-26b-a4b-nfs-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
