apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qdrant-route
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Qdrant"
    gethomepage.dev/group: "AI & Automation"
    gethomepage.dev/icon: "mdi-database-search-outline"
    gethomepage.dev/description: "Vector similarity search database"
    gethomepage.dev/href: "https://qdrant.crobasaurusrex.ryanbeales.com/dashboard"
  namespace: qdrant
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: crobceratops-gateway
      namespace: gateways
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: crobasaurusrex-gateway
      namespace: gateways
  hostnames:
    - qdrant.crobceratops.ryanbeales.com
    - qdrant.crobasaurusrex.ryanbeales.com
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - group: ''
          kind: Service
          name: qdrant
          port: 6333
          weight: 1
      timeouts:
        request: 300s
