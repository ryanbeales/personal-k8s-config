apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-route
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Hermes Dashboard"
    gethomepage.dev/group: "AI & Automation"
    gethomepage.dev/icon: "mdi-robot-outline"
    gethomepage.dev/description: "Hermes Agent built-in TUI & status dashboard"
  namespace: hermes   
spec:
  parentRefs:
    - group: gateway.networking.k8s.io	
      kind: Gateway
      name: crobceratops-gateway
      namespace: gateways
    - group: gateway.networking.k8s.io	
      kind: Gateway
      name: crobasaurusrex-gateway
      namespace: gateways
  hostnames:
    - hermes.crobceratops.ryanbeales.com
    - hermes.crobasaurusrex.ryanbeales.com
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - group: ''	
          kind: Service
          name: hermes
          port: 9119
          weight: 1
