apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-harness
  namespace: deepseek-harness
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: deepseek-harness
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deepseek-harness
    spec:
      containers:
        - name: proxy
          image: alpine:latest
          command: ["sh", "-c"]
          args: ["apk add socat && socat TCP-LISTEN:3080,fork,reuseaddr TCP:127.0.0.1:3081"]
          ports:
            - name: http
              containerPort: 3080
        - name: deepseek-harness
          # renovate: datasource=docker depname=node versioning=loose
          image: node:24-bookworm-slim
          command:
            - "sh"
            - "-c"
          args:
            - "npm install -g @deepseek-ai/dsh && dsh web --no-open --port 3081"
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: deepseek-harness-github-secret
                  key: GITHUB_TOKEN
                  optional: true
            - name: OPENAI_API_BASE
              value: http://llama-gemma4-12b.llama.svc.cluster.local:8000/v1
            - name: OPENAI_API_KEY
              value: sk-dummy
          volumeMounts:
            - name: data
              mountPath: /root
            - name: npm-cache
              mountPath: /root/.npm
          startupProbe:
            httpGet:
              path: /
              port: 3081
            # 120 * 10 seconds = 20 minutes
            failureThreshold: 120
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3081
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3081
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deepseek-harness-nfs-pvc
        - name: npm-cache
          emptyDir: {}
