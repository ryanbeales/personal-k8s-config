apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui-route
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Open WebUI"
    gethomepage.dev/group: "AI & Automation"
    gethomepage.dev/icon: "open-webui.png"
    gethomepage.dev/description: "Chat interface for local and cloud LLMs"
  namespace: open-webui   
spec:
  parentRefs:
    - group: gateway.networking.k8s.io	
      kind: Gateway
      name: crobceratops-gateway
      namespace: gateways
    - group: gateway.networking.k8s.io	
      kind: Gateway
      name: crobasaurusrex-gateway
      namespace: gateways
  hostnames:
    - open-webui.crobceratops.ryanbeales.com
    - open-webui.crobasaurusrex.ryanbeales.com
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - group: ''	
          kind: Service
          name: open-webui
          port: 8080
          weight: 1
      timeouts:
        request: 300s