apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-bonsai-2-27b-1bit
  namespace: llama
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-bonsai-2-27b-1bit
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-bonsai-2-27b-1bit
    spec:
      runtimeClassName: nvidia
      nodeName: crobputer
      tolerations:
        - key: dedicated
          operator: Equal
          value: crobputer
          effect: NoSchedule
      initContainers:
        - name: download-model
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /models/Ternary-Bonsai-2-27B-PTQ1_0.gguf ]; then
                echo "Downloading prism-ml/Ternary-Bonsai-2-27B-gguf (PTQ1_0)..."
                curl -L -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" -o /models/Ternary-Bonsai-2-27B-PTQ1_0.gguf "https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/main/Ternary-Bonsai-2-27B-PTQ1_0.gguf"
              else
                echo "Model Ternary-Bonsai-2-27B-PTQ1_0.gguf already downloaded."
              fi
              if [ ! -f /models/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf ]; then
                echo "Downloading vision projector Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf..."
                curl -L -H "Authorization: Bearer $HUGGING_FACE_HUB_TOKEN" -o /models/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf "https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/main/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf"
              else
                echo "Vision projector already downloaded."
              fi
              if [ ! -f /models/prism-b10685/llama-server ]; then
                echo "Downloading PrismML llama.cpp release (prism-b10685)..."
                mkdir -p /models/prism-b10685
                curl -L -o /tmp/llama-prism.tar.gz "https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b10685-7dffb15/llama-prism-b10685-7dffb15-bin-linux-cuda-12.8-x64.tar.gz"
                tar -xzf /tmp/llama-prism.tar.gz -C /models/prism-b10685 --strip-components=1
                rm -f /tmp/llama-prism.tar.gz
                chmod +x /models/prism-b10685/llama-server
              else
                echo "PrismML llama.cpp binaries already downloaded."
              fi
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true
          volumeMounts:
            - name: cache-volume
              mountPath: /models
      containers:
        - name: llama-cpp
          # renovate: datasource=docker depname=ghcr.io/ggml-org/llama.cpp versioning=loose
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command: ["/bin/sh", "-c"]
          args:
            - |
              /models/prism-b10685/llama-server \
                -m /models/Ternary-Bonsai-2-27B-PTQ1_0.gguf \
                --mmproj /models/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf \
                -c 131072 \
                -np 1 \
                -ctk q4_0 \
                -ctv q4_0 \
                --flash-attn on \
                -ngl 99 \
                -n 8192 \
                --alias llama-bonsai-2-27b-1bit \
                --host 0.0.0.0 \
                --port 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: cache-volume
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: llama-bonsai-2-27b-1bit-nfs-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
